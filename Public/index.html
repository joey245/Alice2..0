<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alice</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- ========================================
         THREE.JS + VRM
         ======================================== -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
        }
    }
    </script>

</head>


<body>

    <!-- ========================================
         3D ALICE
         ======================================== -->

    <div id="avatar-container"></div>


    <!-- ========================================
         CHAT UI
         ======================================== -->

    <div id="chat-ui">

        <div id="response">
            H-hi! I'm Alice... 💜
        </div>


        <div id="input-area">

            <input
                id="message"
                type="text"
                placeholder="Talk to Alice..."
                autocomplete="off"
            >

           
<button
    id="memoryButton"
    type="button"
>
    🧠 Memories
</button>


<div id="memory-panel">

    <div id="memory-header">

        <strong>
            Alice's Memories
        </strong>

        <button
            id="closeMemoryButton"
            type="button"
        >
            ✕
        </button>

    </div>

    <div id="memory-count">
        Loading memories...
    </div>

    <div id="memory-list"></div>

</div>


           

            <button
                id="micButton"
                title="Talk to Alice"
            >
                🎤
            </button>


        

            <button
                id="screenButton"
                title="Let Alice look at your screen"
            >
                👀
            </button>


          

            <button
                id="sendButton"
                title="Send message"
            >
                Send
            </button>

        </div>

    </div>


    <!-- ========================================
         LOADING
         ======================================== -->

    <div id="loading">
        Loading Alice...
    </div>


    <!-- ========================================
         SCRIPT
         ======================================== -->

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
